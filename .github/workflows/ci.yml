name: RelayBox CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: relaybox-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration-tests:
    name: Integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: relaybox_test
          POSTGRES_USER: relaybox_test
          POSTGRES_PASSWORD: relaybox_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U relaybox_test -d relaybox_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DB_URL: jdbc:postgresql://localhost:5432/relaybox_test
      DB_USER: relaybox_test
      DB_PASSWORD: relaybox_test
      RELAYBOX_MASTER_KEY: ci-test-master-key
      TEST_RECEIVER_ENABLED: "true"
      ALLOW_PRIVATE_WEBHOOK_TARGETS: "true"
      DELIVERY_MAX_ATTEMPTS: 3
      WORKER_POLL_INTERVAL_MS: 100
      RETRY_BASE_DELAY_SECONDS: 1
      RETRY_JITTER_SECONDS: 0
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Run integration tests
        run: mvn -B test
