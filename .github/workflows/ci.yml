name: RelayBox CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: relaybox-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compose-e2e:
    name: Compose service handoff and recovery
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RELAYBOX_API_BIND_ADDRESS: 0.0.0.0
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Build and start the Compose stack
        run: docker compose up --build --detach --wait
      - name: Verify Outbox, RabbitMQ, Inbox, and recovery
        run: node scripts/compose-e2e.mjs
      - name: Stop Compose services
        if: always()
        run: docker compose down --remove-orphans --volumes

  integration-tests:
    name: Integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: relaybox_test
          POSTGRES_USER: relaybox_test
          POSTGRES_PASSWORD: relaybox_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U relaybox_test -d relaybox_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DB_URL: jdbc:postgresql://localhost:5432/relaybox_test
      DB_USER: relaybox_test
      DB_PASSWORD: relaybox_test
      RELAYBOX_MASTER_KEY: test-master-key
      TEST_RECEIVER_ENABLED: "true"
      ALLOW_PRIVATE_WEBHOOK_TARGETS: "true"
      DELIVERY_MAX_ATTEMPTS: 3
      WORKER_POLL_INTERVAL_MS: 100
      RETRY_BASE_DELAY_SECONDS: 1
      RETRY_JITTER_SECONDS: 0
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Run integration tests
        run: mvn -B test
      - name: Run Delivery Service messaging tests
        run: mvn -B -f delivery-service/pom.xml test
