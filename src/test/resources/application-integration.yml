spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:55432/relaybox_test}
    username: ${DB_USER:relaybox_test}
    password: ${DB_PASSWORD:relaybox_test}
relaybox:
  master-key: ${RELAYBOX_MASTER_KEY:test-master-key}
  rate-limit:
    default-events-per-minute: ${DEFAULT_EVENTS_PER_MINUTE:120}
  webhook:
    allow-private-targets: true
  test-receiver:
    enabled: true
    chaos-first-delay-ms: 20
  worker:
    batch-size: 20
    poll-interval-ms: ${WORKER_POLL_INTERVAL_MS:100}
    max-attempts: ${DELIVERY_MAX_ATTEMPTS:3}
    retry-base-delay-seconds: ${RETRY_BASE_DELAY_SECONDS:1}
    retry-jitter-seconds: ${RETRY_JITTER_SECONDS:0}
