spring:
  application:
    name: relaybox
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/relaybox}
    username: ${DB_USER:relaybox}
    password: ${DB_PASSWORD:relaybox}
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: non_null
server:
  port: ${PORT:8080}
relaybox:
  master-key: ${RELAYBOX_MASTER_KEY:local-master-key}
  test-receiver:
    enabled: ${TEST_RECEIVER_ENABLED:false}
  worker:
    batch-size: ${WORKER_BATCH_SIZE:20}
    poll-interval-ms: ${WORKER_POLL_INTERVAL_MS:1000}
    max-attempts: ${DELIVERY_MAX_ATTEMPTS:8}
    retry-base-delay-seconds: ${RETRY_BASE_DELAY_SECONDS:5}
    retry-jitter-seconds: ${RETRY_JITTER_SECONDS:3}
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
