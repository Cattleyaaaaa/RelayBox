spring:
  application:
    name: relaybox-delivery-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/relaybox_delivery}
    username: ${DB_USER:relaybox_delivery}
    password: ${DB_PASSWORD:relaybox_delivery}
  flyway:
    enabled: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:relaybox}
    password: ${RABBITMQ_PASSWORD:relaybox}
    listener:
      simple:
        acknowledge-mode: auto
        default-requeue-rejected: false
        concurrency: 1
        max-concurrency: 1
        prefetch: 20
server:
  port: ${SERVER_PORT:8081}
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
relaybox:
  internal-token: ${INTERNAL_SERVICE_TOKEN:local-internal-key}
  messaging:
    ingest-retry-attempts: ${INGEST_RETRY_ATTEMPTS:5}
    ingest-retry-backoff-ms: ${INGEST_RETRY_BACKOFF_MS:100}
  webhook:
    allow-private-targets: ${ALLOW_PRIVATE_WEBHOOK_TARGETS:false}
  worker:
    batch-size: ${WORKER_BATCH_SIZE:40}
    concurrency: ${WORKER_CONCURRENCY:16}
    max-concurrency: ${WORKER_MAX_CONCURRENCY:32}
    queue-capacity: ${WORKER_QUEUE_CAPACITY:500}
    poll-interval-ms: ${WORKER_POLL_INTERVAL_MS:100}
    lease-seconds: ${WORKER_LEASE_SECONDS:120}
    max-attempts: ${DELIVERY_MAX_ATTEMPTS:8}
    retry-base-delay-seconds: ${RETRY_BASE_DELAY_SECONDS:5}
    retry-jitter-seconds: ${RETRY_JITTER_SECONDS:3}
  circuit:
    default-failure-threshold: ${CIRCUIT_FAILURE_THRESHOLD:5}
    default-open-duration-seconds: ${CIRCUIT_OPEN_DURATION_SECONDS:30}
  metrics:
    refresh-interval-ms: ${METRICS_REFRESH_INTERVAL_MS:10000}
